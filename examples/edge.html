

<!-- A comment before the doctype -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edge-case example</title>
</head>
<body>
  <p>This page has the right doctype, but it sits on line 4 — blank
  lines and a comment come first. Old browsers treated that as
  quirks mode, and it is a sign the doctype drifted.</p>
</body>
</html>
